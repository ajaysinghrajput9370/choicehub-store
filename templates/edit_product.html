{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div class="edit-product-wrapper">
  <div class="edit-header">
    <h1>✏️ Edit Product</h1>
    <a href="/admin?tab=products" class="btn btn-outline">↩ Back to Products</a>
  </div>

  <form method="POST" action="/admin/edit-product/{{ product.id }}" enctype="multipart/form-data">
    <div class="edit-grid">
      <!-- Left Column -->
      <div class="edit-left">
        <div class="form-group">
          <label>Name *</label>
          <input type="text" name="name" value="{{ product.name }}" required>
        </div>
        <div class="form-group">
          <label>Slug</label>
          <input type="text" name="slug" value="{{ product.slug }}">
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select name="category_id" required>
            {% for cat in categories %}
            <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>{{ cat.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Brand</label>
          <input type="text" name="brand" value="{{ product.brand or '' }}">
        </div>
        <div class="form-group">
          <label>SKU</label>
          <input type="text" name="sku" value="{{ product.sku }}">
        </div>
        <div class="form-group">
          <label>Cost Price</label>
          <input type="number" name="cost_price" step="0.01" value="{{ product.cost_price or 0 }}">
        </div>
        <div class="form-group">
          <label>Selling Price *</label>
          <input type="number" name="selling_price" step="0.01" value="{{ product.selling_price }}" required>
        </div>
        <div class="form-group">
          <label>MRP *</label>
          <input type="number" name="mrp" step="0.01" value="{{ product.mrp }}" required>
        </div>
        <div class="form-group">
          <label>Stock</label>
          <input type="number" name="stock" value="{{ product.stock or 0 }}">
        </div>
        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" name="weight" step="0.01" value="{{ product.weight or '' }}">
        </div>
        <div class="form-group">
          <label>Dimensions</label>
          <input type="text" name="dimensions" value="{{ product.dimensions or '' }}" placeholder="e.g., 10x10x5 cm">
        </div>
        <div class="form-group">
          <label>Material</label>
          <input type="text" name="material" value="{{ product.material or '' }}">
        </div>
        <div class="form-group">
          <label>Care Instructions</label>
          <input type="text" name="care_instructions" value="{{ product.care_instructions or '' }}">
        </div>
        <div class="form-group">
          <label>Warranty</label>
          <input type="text" name="warranty" value="{{ product.warranty or '' }}" placeholder="e.g., 1 year">
        </div>
        <div class="form-group">
          <label>Return Policy</label>
          <input type="text" name="return_policy" value="{{ product.return_policy or '' }}" placeholder="e.g., 7 days">
        </div>
        <div class="form-group">
          <label>Video URL</label>
          <input type="text" name="video_url" value="{{ product.video_url or '' }}" placeholder="YouTube link">
        </div>
        <div class="form-group">
          <label>Assign Seller</label>
          <select name="seller_id">
            <option value="">Admin Product</option>
            {% for s in sellers %}
            <option value="{{ s.id }}" {% if s.id == product.seller_id %}selected{% endif %}>{{ s.user.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <!-- Right Column -->
      <div class="edit-right">
        <div class="form-group">
          <label>Short Description</label>
          <input type="text" name="short_description" value="{{ product.short_description or '' }}">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="4">{{ product.description or '' }}</textarea>
        </div>
        <div class="form-group">
          <label>Features (one per line or comma separated)</label>
          <textarea name="features" rows="3">{{ product.features or '' }}</textarea>
        </div>
        <div class="form-group">
          <label>Specifications (key: value per line)</label>
          <textarea name="specifications" rows="3">{{ product.specifications or '' }}</textarea>
        </div>
        <div class="form-group">
          <label>Images (upload new to replace)</label>
          <input type="file" name="images" multiple accept="image/*">
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
            {% for img in product.image_list() %}
            <img src="{{ img }}" alt="Product image" style="width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid #ddd;">
            {% endfor %}
          </div>
        </div>
        <div class="form-group checkbox-group">
          <label><input type="checkbox" name="is_featured" {% if product.is_featured %}checked{% endif %}> Featured</label>
          <label><input type="checkbox" name="is_bestseller" {% if product.is_bestseller %}checked{% endif %}> Bestseller</label>
          <label><input type="checkbox" name="is_trending" {% if product.is_trending %}checked{% endif %}> Trending</label>
          <label><input type="checkbox" name="is_new" {% if product.is_new %}checked{% endif %}> New</label>
          <label><input type="checkbox" name="free_delivery" {% if product.free_delivery %}checked{% endif %}> Free Delivery</label>
          <label><input type="checkbox" name="cod_available" {% if product.cod_available %}checked{% endif %}> COD</label>
        </div>
        <button type="submit" class="btn btn-primary btn-block">💾 Update Product</button>
      </div>
    </div>
  </form>
</div>

<style>
  .edit-product-wrapper { max-width:1000px; margin:0 auto; padding:20px 16px; }
  .edit-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .edit-header h1 { font-size:1.8rem; font-weight:700; }
  .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .edit-left, .edit-right { background:#fff; padding:20px; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,0.04); }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-weight:600; font-size:0.9rem; margin-bottom:4px; color:#1a1a1a; }
  .form-group input, .form-group select, .form-group textarea { width:100%; padding:8px 12px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:1rem; transition:0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:#b8860b; outline:none; box-shadow:0 0 0 3px rgba(184,134,11,0.1); }
  .checkbox-group { display:flex; flex-wrap:wrap; gap:12px; }
  .checkbox-group label { font-weight:500; display:flex; align-items:center; gap:4px; }
  .btn-block { width:100%; padding:12px; }
  @media (max-width:768px) {
    .edit-grid { grid-template-columns:1fr; }
  }
  body.dark .edit-left, body.dark .edit-right { background:#1a1f2e; }
  body.dark .form-group label { color:#f1f5f9; }
  body.dark .form-group input, body.dark .form-group select, body.dark .form-group textarea { background:#2a3040; border-color:#3a4050; color:#f1f5f9; }
</style>
{% endblock %}
